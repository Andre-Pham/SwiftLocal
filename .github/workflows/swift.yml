name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: Lint
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup Swift
      uses: swift-actions/setup-swift@v2
      with:
        swift-version: '6'
    - name: Install SwiftFormat
      run: brew install swiftformat
    - name: SwiftFormat Check
      run: swiftformat . --lint
    - name: Install SwiftLint
      run: brew install swiftlint
    - name: Generate Compiler Log
      run: |
        set -o pipefail
        swift build --build-tests 2>&1 | tee swift-build.log
    - name: SwiftLint
      run: swiftlint --strict --config .swiftlint.yml
    - name: SwiftLint Analyze
      run: swiftlint analyze --strict --config .swiftlint.yml --compiler-log-path swift-build.log

  build-and-test:
    name: Build and Test
    runs-on: macos-latest
    needs: lint

    steps:
    - uses: actions/checkout@v4
    - name: Setup Swift
      uses: swift-actions/setup-swift@v2
      with:
        swift-version: '6'
    - name: Build
      run: swift build
    - name: Run Tests
      run: swift test

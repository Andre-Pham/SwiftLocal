name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: Lint
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install SwiftFormat
      run: brew install swiftformat
    - name: SwiftFormat Check
      run: swiftformat . --lint

  build-and-test:
    name: Build and Test
    runs-on: macos-latest
    needs: lint

    steps:
    - uses: actions/checkout@v4
    - name: Setup Swift
      uses: swift-actions/setup-swift@v2
      with:
        swift-version: '6'
    - name: Build
      run: swift build
    - name: Run Tests
      run: swift test
